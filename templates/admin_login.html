<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Student Query Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f6f3ff, #ece8ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            padding: 42px;
            border-radius: 18px;
            box-shadow: 0 18px 45px rgba(75, 45, 140, 0.14);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .admin-icon {
            width: 66px;
            height: 66px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #6d3fc0;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(109, 63, 192, 0.25);
        }

        h1 {
            font-size: 27px;
            color: #211b35;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #746d82;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #3d374b;
        }

        input {
            width: 100%;
            height: 49px;
            padding: 0 14px;
            border: 1px solid #d9d4e4;
            border-radius: 9px;
            font-size: 15px;
            color: #292333;
            background: #ffffff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder {
            color: #aaa4b5;
        }

        input:focus {
            border-color: #6d3fc0;
            box-shadow: 0 0 0 3px rgba(109, 63, 192, 0.10);
        }

        .login-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 9px;
            background: #6d3fc0;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.2s, transform 0.2s;
        }

        .login-btn:hover {
            background: #58309f;
            transform: translateY(-1px);
        }

        .error-message {
            background: #fff1f2;
            color: #b4232c;
            border: 1px solid #fecdd3;
            padding: 11px 13px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.4;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            text-decoration: none;
            color: #746d82;
            font-size: 14px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #6d3fc0;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="header">

        <div class="admin-icon">
            A
        </div>

        <h1>Admin Login</h1>

        <p class="subtitle">
            Student Query Portal Administration
        </p>

    </div>


    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="error-message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form method="POST" action="{{ url_for('admin_login') }}">

        <div class="form-group">

            <label for="admin_id">
                Admin ID
            </label>

            <input
                type="text"
                id="admin_id"
                name="admin_id"
                placeholder="Enter your Admin ID"
                autocomplete="username"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

        </div>


        <button type="submit" class="login-btn">
            Login to Admin Dashboard
        </button>

    </form>


    <a href="{{ url_for('home') }}" class="back-link">
        Back to Home
    </a>

</div>

</body>
</html>
